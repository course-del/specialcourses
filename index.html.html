<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課程新視界 - 國立臺北大學特色課程查詢系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body { font-family: 'Noto+Sans+TC', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 text-slate-800 min-h-screen selection:bg-purple-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect } = React;

    const THEMES = ['全部主軸', '科技賦能', '社會共好', '自主探索', '跨域創新', '實作體驗', '永續職能'];
    const COURSE_TYPES = ['全部', '必修', '選修', '通識'];
    const DURATION_TYPES = ['半學年', '全學年'];

    // 參照您的範例圖風格，為六大主軸設計的精緻師生互動向量情境插圖 (SVG)
    const THEME_CONFIGS = {
      '科技賦能': { 
        badgeBg: 'bg-blue-50', 
        text: 'text-blue-700', 
        svgIllustration: (
          <svg viewBox="0 0 400 200" className="w-full h-full object-cover">
            <defs>
              <linearGradient id="bg-tech" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#3b82f6" />
                <stop offset="50%" stopColor="#6366f1" />
                <stop offset="100%" stopColor="#1e1b4b" />
              </linearGradient>
            </defs>
            <rect width="400" height="200" fill="url(#bg-tech)" />
            {/* 背景波浪與發光線條 */}
            <path d="M 0 150 Q 150 80 400 130 L 400 200 L 0 200 Z" fill="#ffffff" opacity="0.1" />
            <path d="M 50 120 Q 200 50 350 100" stroke="#93c5fd" strokeWidth="2" fill="none" opacity="0.4" />
            {/* 浮動科技方塊 */}
            <rect x="220" y="30" width="35" height="35" rx="8" fill="#ffffff" opacity="0.2" />
            <circle cx="237.5" cy="47.5" r="8" stroke="#ffffff" strokeWidth="2" fill="none" opacity="0.8" />
            <rect x="290" y="50" width="45" height="40" rx="8" fill="#ffffff" opacity="0.25" />
            <rect x="300" y="60" width="25" height="15" rx="2" fill="#93c5fd" opacity="0.6" />
            {/* 電腦螢幕 */}
            <rect x="150" y="70" width="130" height="90" rx="6" fill="#1e293b" stroke="#93c5fd" strokeWidth="2" />
            <rect x="160" y="80" width="110" height="70" rx="4" fill="#0f172a" />
            <circle cx="215" cy="110" r="15" stroke="#38bdf8" strokeWidth="2" fill="none" opacity="0.8" />
            <path d="M 205 125 Q 215 115 225 125" stroke="#38bdf8" strokeWidth="2" fill="none" />
            {/* 師生人物剪影互動 */}
            {/* 左側學生 */}
            <circle cx="100" cy="115" r="12" fill="#fbbf24" />
            <path d="M 85 160 Q 95 130 115 130 L 125 160 Z" fill="#3b82f6" />
            {/* 右側老師/同學指導 */}
            <circle cx="310" cy="95" r="14" fill="#f43f5e" />
            <path d="M 290 150 Q 310 110 330 150 Z" fill="#6366f1" />
            <path d="M 310 105 L 270 125" stroke="#f43f5e" strokeWidth="4" strokeLinecap="round" />
          </svg>
        ) 
      },
      '社會共好': { 
        badgeBg: 'bg-orange-50', 
        text: 'text-orange-700', 
        svgIllustration: (
          <svg viewBox="0 0 400 200" className="w-full h-full object-cover">
            <defs>
              <linearGradient id="bg-social" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#f97316" />
                <stop offset="50%" stopColor="#ea580c" />
                <stop offset="100%" stopColor="#9a3412" />
              </linearGradient>
            </defs>
            <rect width="400" height="200" fill="url(#bg-social)" />
            <path d="M 0 160 Q 200 100 400 150 L 400 200 L 0 200 Z" fill="#ffffff" opacity="0.15" />
            {/* 社群與愛心互動圖標 */}
            <circle cx="200" cy="60" r="25" fill="#ffffff" opacity="0.2" />
            <path d="M 190 60 L 210 60 M 200 50 L 200 70" stroke="#ffffff" strokeWidth="3" strokeLinecap="round" opacity="0.8" />
            {/* 多人群體互動剪影 */}
            <circle cx="120" cy="100" r="12" fill="#fde68a" />
            <path d="M 100 160 Q 120 120 140 160 Z" fill="#2563eb" />
            <circle cx="200" cy="85" r="14" fill="#fde68a" />
            <path d="M 180 160 Q 200 100 220 160 Z" fill="#16a34a" />
            <circle cx="280" cy="100" r="12" fill="#fde68a" />
            <path d="M 260 160 Q 280 120 300 160 Z" fill="#dc2626" />
          </svg>
        ) 
      },
      '自主探索': { 
        badgeBg: 'bg-fuchsia-50', 
        text: 'text-fuchsia-700', 
        svgIllustration: (
          <svg viewBox="0 0 400 200" className="w-full h-full object-cover">
            <defs>
              <linearGradient id="bg-explore" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#d946ef" />
                <stop offset="50%" stopColor="#9333ea" />
                <stop offset="100%" stopColor="#581c87" />
              </linearGradient>
            </defs>
            <rect width="400" height="200" fill="url(#bg-explore)" />
            <path d="M 0 140 Q 200 180 400 120 L 400 200 L 0 200 Z" fill="#ffffff" opacity="0.1" />
            {/* 指南針與地圖意象 */}
            <circle cx="200" cy="90" r="35" stroke="#f0abfc" strokeWidth="3" fill="#ffffff" fillOpacity="0.15" />
            <polygon points="200,65 210,95 200,90 190,95" fill="#f472b6" />
            <polygon points="200,115 210,85 200,90 190,85" fill="#ffffff" />
            {/* 探索者剪影 */}
            <circle cx="110" cy="110" r="13" fill="#fed7aa" />
            <path d="M 90 160 Q 110 130 130 160 Z" fill="#38bdf8" />
          </svg>
        ) 
      },
      '跨域創新': { 
        badgeBg: 'bg-pink-50', 
        text: 'text-pink-700', 
        svgIllustration: (
          <svg viewBox="0 0 400 200" className="w-full h-full object-cover">
            <defs>
              <linearGradient id="bg-innovate" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#ec4899" />
                <stop offset="50%" stopColor="#e11d48" />
                <stop offset="100%" stopColor="#881337" />
              </linearGradient>
            </defs>
            <rect width="400" height="200" fill="url(#bg-innovate)" />
            <path d="M 0 150 Q 180 90 400 140 L 400 200 L 0 200 Z" fill="#ffffff" opacity="0.12" />
            {/* 燈泡與發想圖標 */}
            <circle cx="200" cy="80" r="28" fill="#fef08a" opacity="0.9" />
            <path d="M 190 100 L 210 100 M 195 106 L 205 106" stroke="#ca8a04" strokeWidth="3" strokeLinecap="round" />
            {/* 團隊腦力激盪 */}
            <circle cx="130" cy="120" r="12" fill="#fed7aa" />
            <path d="M 110 160 Q 130 140 150 160 Z" fill="#4f46e5" />
            <circle cx="270" cy="120" r="12" fill="#fed7aa" />
            <path d="M 250 160 Q 270 140 290 160 Z" fill="#0d9488" />
          </svg>
        ) 
      },
      '實作體驗': { 
        badgeBg: 'bg-emerald-50', 
        text: 'text-emerald-700', 
        svgIllustration: (
          <svg viewBox="0 0 400 200" className="w-full h-full object-cover">
            <defs>
              <linearGradient id="bg-practice" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#059669" />
                <stop offset="50%" stopColor="#0d9488" />
                <stop offset="100%" stopColor="#042f2e" />
              </linearGradient>
            </defs>
            <rect width="400" height="200" fill="url(#bg-practice)" />
            <path d="M 0 140 Q 200 190 400 130 L 400 200 L 0 200 Z" fill="#ffffff" opacity="0.1" />
            {/* 齒輪與工具圖標 */}
            <circle cx="200" cy="85" r="25" stroke="#99f6e4" strokeWidth="4" strokeLinecap="round" strokeDasharray="10 5" fill="none" />
            <circle cx="200" cy="85" r="10" fill="#ccfbf1" />
            {/* 動手實作剪影 */}
            <circle cx="150" cy="115" r="12" fill="#fde68a" />
            <path d="M 135 160 Q 150 130 165 160 Z" fill="#2563eb" />
          </svg>
        ) 
      },
      '永續職能': { 
        badgeBg: 'bg-cyan-50', 
        text: 'text-cyan-700', 
        svgIllustration: (
          <svg viewBox="0 0 400 200" className="w-full h-full object-cover">
            <defs>
              <linearGradient id="bg-sustain" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#06b6d4" />
                <stop offset="50%" stopColor="#0284c7" />
                <stop offset="100%" stopColor="#082f49" />
              </linearGradient>
            </defs>
            <rect width="400" height="200" fill="url(#bg-sustain)" />
            <path d="M 0 150 Q 200 100 400 160 L 400 200 L 0 200 Z" fill="#ffffff" opacity="0.12" />
            {/* 地球與綠能葉片 */}
            <circle cx="200" cy="85" r="30" stroke="#a5f3fc" strokeWidth="3" fill="none" opacity="0.8" />
            <path d="M 185 85 Q 200 65 215 85 Q 200 105 185 85 Z" fill="#6ee7b7" />
            {/* 團隊永續共學 */}
            <circle cx="140" cy="110" r="12" fill="#fed7aa" />
            <path d="M 125 160 Q 140 130 155 160 Z" fill="#16a34a" />
          </svg>
        ) 
      }
    };

    const INITIAL_COURSES = [
      {
        id: '1',
        theme: '科技賦能',
        name: '人工智慧與跨域應用實作',
        dept: '資訊工程學系',
        teacher: '張教授',
        semester: '114-1',
        type: '選修',
        duration: '半學年',
        credits: '3',
        tags: 'AI、Python、跨域共授',
        desc: '結合AI核心邏輯與各學門領域應用，帶領學生從零開始動手打造智慧專題。',
        syllabusUrl: 'https://ntpu.edu.tw',
        images: []
      }
    ];

    function App() {
      const [courses, setCourses] = useState(() => {
        const saved = localStorage.getItem('ntpu_courses_local_v5');
        return saved ? JSON.parse(saved) : INITIAL_COURSES;
      });

      const [searchQuery, setSearchQuery] = useState('');
      const [filterTheme, setFilterTheme] = useState('全部主軸');
      const [filterDept, setFilterDept] = useState('');
      const [filterType, setFilterType] = useState('全部');

      const [isAdmin, setIsAdmin] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [adminPassword, setAdminPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      const [showFormModal, setShowFormModal] = useState(false);
      const [editingCourse, setEditingCourse] = useState(null);

      const saveToLocal = (newCourses) => {
        setCourses(newCourses);
        localStorage.setItem('ntpu_courses_local_v5', JSON.stringify(newCourses));
      };

      const filteredCourses = useMemo(() => {
        return courses.filter(course => {
          const matchTheme = filterTheme === '全部主軸' || course.theme === filterTheme;
          const matchDept = filterDept === '' || (course.dept && course.dept.includes(filterDept));
          const matchType = filterType === '全部' || course.type === filterType;
          const searchTarget = `${course.name} ${course.teacher} ${course.tags} ${course.desc}`.toLowerCase();
          const matchSearch = searchQuery === '' || searchTarget.includes(searchQuery.toLowerCase());
          return matchTheme && matchDept && matchType && matchSearch;
        });
      }, [courses, filterTheme, filterDept, filterType, searchQuery]);

      const departments = useMemo(() => {
        const depts = new Set(courses.map(c => c.dept).filter(Boolean));
        return ['全部單位', ...Array.from(depts)];
      }, [courses]);

      const handleSaveCourse = (courseData) => {
        if (editingCourse && editingCourse.id) {
          const updated = courses.map(c => c.id === editingCourse.id ? { ...courseData, id: c.id } : c);
          saveToLocal(updated);
        } else {
          const newCourse = { ...courseData, id: Date.now().toString() };
          saveToLocal([newCourse, ...courses]);
        }
        setShowFormModal(false);
        setEditingCourse(null);
      };

      const handleDeleteCourse = (id) => {
        if (window.confirm('確定要刪除這筆課程資料嗎？')) {
          const updated = courses.filter(c => c.id !== id);
          saveToLocal(updated);
        }
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPassword === 'admin123') {
          setIsAdmin(true);
          setShowLoginModal(false);
          setAdminPassword('');
          setLoginError('');
        } else {
          setLoginError('密碼錯誤 (請輸入 admin123)');
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          <header className="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-white/50 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="bg-gradient-to-tr from-purple-500 to-pink-500 p-2 rounded-xl shadow-inner text-white">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </div>
                <div>
                  <h1 className="text-xl sm:text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-purple-700 to-pink-600 tracking-tight leading-none">
                    課程新視界
                  </h1>
                  <span className="text-[10px] sm:text-xs text-slate-500 font-medium tracking-wider mt-1 hidden sm:block">
                    探索特色課程，開啟學習新可能
                  </span>
                </div>
              </div>
              <div>
                {isAdmin ? (
                  <button onClick={() => setIsAdmin(false)} className="text-sm bg-rose-100 hover:bg-rose-200 text-rose-700 px-4 py-2 rounded-full font-medium transition">
                    登出管理員
                  </button>
                ) : (
                  <button onClick={() => setShowLoginModal(true)} className="text-sm text-slate-600 hover:text-purple-600 hover:bg-purple-50 px-4 py-2 rounded-full font-medium transition">
                    管理維護
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col md:flex-row gap-8 flex-grow w-full">
            {!isAdmin && (
              <aside className="w-full md:w-1/4 md:sticky md:top-24 h-max space-y-6">
                <div className="bg-white/70 backdrop-blur-xl p-6 rounded-3xl shadow-sm border border-white">
                  <h2 className="text-lg font-bold text-slate-800 mb-5 pb-3 border-b border-slate-200/50">探索課程</h2>
                  <div className="mb-6">
                    <input
                      type="text"
                      placeholder="搜尋課名、教師、標籤..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full px-4 py-3 bg-white/90 border-0 rounded-2xl ring-1 ring-slate-200 focus:ring-2 focus:ring-purple-400 outline-none text-sm shadow-sm"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3 mb-6">
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase ml-1">單位</label>
                      <select
                        value={filterDept === '' ? '全部單位' : filterDept}
                        onChange={(e) => setFilterDept(e.target.value === '全部單位' ? '' : e.target.value)}
                        className="w-full p-2.5 bg-white/90 border-0 rounded-xl ring-1 ring-slate-200 text-sm shadow-sm"
                      >
                        {departments.map(dept => <option key={dept} value={dept}>{dept}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase ml-1">必選修</label>
                      <select
                        value={filterType}
                        onChange={(e) => setFilterType(e.target.value)}
                        className="w-full p-2.5 bg-white/90 border-0 rounded-xl ring-1 ring-slate-200 text-sm shadow-sm"
                      >
                        {COURSE_TYPES.map(type => <option key={type} value={type}>{type}</option>)}
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-500 mb-2 uppercase ml-1">六大主軸</label>
                    <div className="space-y-2">
                      {THEMES.map(theme => {
                        const isSelected = filterTheme === theme;
                        const themeBtnStyles = {
                          '全部主軸': 'from-slate-400 to-slate-500',
                          '科技賦能': 'from-blue-500 to-indigo-500',
                          '社會共好': 'from-orange-400 to-red-400',
                          '自主探索': 'from-fuchsia-500 to-purple-600',
                          '跨域創新': 'from-pink-500 to-rose-500',
                          '實作體驗': 'from-emerald-400 to-teal-500',
                          '永續職能': 'from-cyan-500 to-blue-500'
                        };
                        return (
                          <button
                            key={theme}
                            onClick={() => setFilterTheme(theme)}
                            className={`w-full text-left px-5 py-3 rounded-2xl text-sm transition-all duration-300 flex items-center justify-between
                              ${isSelected ? `bg-gradient-to-r ${themeBtnStyles[theme]} text-white font-medium shadow-md scale-[1.02]` : 'bg-white/50 text-slate-600 hover:bg-white'}`}
                          >
                            <span>{theme}</span>
                            {isSelected && <span className="w-2 h-2 rounded-full bg-white"></span>}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </aside>
            )}

            <section className={`w-full ${isAdmin ? 'md:w-full' : 'md:w-3/4'}`}>
              {isAdmin ? (
                <div className="bg-white/80 backdrop-blur-xl rounded-3xl p-6 shadow-sm border border-white">
                  <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                    <h2 className="text-2xl font-bold text-slate-800">資料維護中心 (本機儲存)</h2>
                    <button onClick={() => { setEditingCourse(null); setShowFormModal(true); }} className="px-5 py-2.5 bg-gradient-to-r from-purple-600 to-pink-500 text-white rounded-xl text-sm font-medium shadow-md">
                      + 新增課程
                    </button>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse min-w-[700px]">
                      <thead>
                        <tr className="text-slate-500 text-sm border-b border-slate-200">
                          <th className="p-4">圖片 / 主軸 / 名稱</th>
                          <th className="p-4">單位 / 教師</th>
                          <th className="p-4">性質 / 學期 / 學分</th>
                          <th className="p-4 text-center">操作</th>
                        </tr>
                      </thead>
                      <tbody>
                        {courses.map(course => (
                          <tr key={course.id} className="border-b border-slate-100 hover:bg-white/50">
                            <td className="p-4 flex items-center space-x-3">
                              <div className="w-12 h-12 rounded-lg bg-slate-200 flex-shrink-0 overflow-hidden flex items-center justify-center">
                                {course.images && course.images.length > 0 ? (
                                  <img src={course.images[0]} className="w-full h-full object-cover" />
                                ) : (
                                  <span className="text-xs text-slate-400">情境圖</span>
                                )}
                              </div>
                              <div>
                                <span className="inline-block px-2 py-0.5 bg-purple-100 text-purple-700 text-xs rounded mb-0.5">{course.theme}</span>
                                <div className="font-bold">{course.name}</div>
                              </div>
                            </td>
                            <td className="p-4 text-sm"><div>{course.dept}</div><div className="text-slate-500">{course.teacher}</div></td>
                            <td className="p-4 text-sm">
                              <div><span className="font-bold text-purple-600">{course.type || '必修'}</span> / {course.duration || '半學年'}</div>
                              <div className="text-slate-500">{course.semester} ({course.credits}學分)</div>
                            </td>
                            <td className="p-4 text-center space-x-2">
                              <button onClick={() => { setEditingCourse(course); setShowFormModal(true); }} className="text-indigo-600 font-medium">編輯</button>
                              <button onClick={() => handleDeleteCourse(course.id)} className="text-rose-500 font-medium">刪除</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              ) : (
                <div>
                  <div className="mb-6 px-2 flex justify-between items-center">
                    <h2 className="text-2xl font-black text-slate-800">{filterTheme} ({filteredCourses.length})</h2>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {filteredCourses.map(course => <CourseCard key={course.id} course={course} />)}
                  </div>
                </div>
              )}
            </section>
          </main>

          {showLoginModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl">
                <h3 className="text-xl font-bold mb-4">管理員登入</h3>
                <form onSubmit={handleAdminLogin}>
                  <input type="password" value={adminPassword} onChange={e => setAdminPassword(e.target.value)} placeholder="請輸入密碼 (admin123)" className="w-full p-3 border rounded-2xl mb-4 outline-none focus:ring-2 focus:ring-purple-400" autoFocus />
                  {loginError && <p className="text-rose-500 text-sm mb-3">{loginError}</p>}
                  <button type="submit" className="w-full py-3 bg-purple-600 text-white rounded-2xl font-bold shadow-md">登入後台</button>
                </form>
              </div>
            </div>
          )}

          {showFormModal && <CourseFormModal course={editingCourse} onClose={() => setShowFormModal(false)} onSave={handleSaveCourse} />}
        </div>
      );
    }

    // 課程卡片元件
    function CourseCard({ course }) {
      const [currentImgIdx, setCurrentImgIdx] = useState(0);
      const config = THEME_CONFIGS[course.theme] || { badgeBg: 'bg-purple-50', text: 'text-purple-700', svgIllustration: null };
      
      const hasImages = course.images && course.images.length > 0;

      useEffect(() => {
        if (!hasImages || course.images.length <= 1) return;
        const timer = setInterval(() => {
          setCurrentImgIdx(prev => (prev + 1) % course.images.length);
        }, 3500);
        return () => clearInterval(timer);
      }, [hasImages, course.images]);

      return (
        <div className="bg-white/80 backdrop-blur-lg rounded-[2rem] p-4 shadow-sm border border-white flex flex-col h-full hover:shadow-md transition">
          <div className="relative h-48 rounded-[1.5rem] overflow-hidden mb-4 shadow-inner bg-slate-900">
            {hasImages ? (
              <>
                <img src={course.images[currentImgIdx]} className="w-full h-full object-cover transition-all duration-700" />
                {course.images.length > 1 && (
                  <div className="absolute bottom-2 left-1/2 -translate-x-1/2 flex space-x-1.5 z-10">
                    {course.images.map((_, idx) => (
                      <span key={idx} className={`w-2 h-2 rounded-full transition-all ${idx === currentImgIdx ? 'bg-white w-4' : 'bg-white/50'}`}></span>
                    ))}
                  </div>
                )}
              </>
            ) : (
              <div className="w-full h-full">
                {config.svgIllustration}
              </div>
            )}
            
            <span className="absolute top-3 left-3 bg-white/90 text-slate-700 text-xs font-bold px-3 py-1 rounded-full shadow-sm z-10">{course.semester}</span>
            <span className={`absolute top-3 right-3 bg-white/90 ${config.text} text-xs font-black px-3 py-1 rounded-full shadow-sm z-10`}>{course.theme}</span>
          </div>

          <h3 className="text-xl font-black mb-3">
            {course.syllabusUrl ? (
              <a href={course.syllabusUrl} target="_blank" rel="noreferrer" className="hover:text-purple-600 underline decoration-purple-300 underline-offset-4 transition flex items-center w-fit">
                {course.name}
                <svg className="w-4 h-4 ml-1.5 opacity-70 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
              </a>
            ) : (
              <span>{course.name}</span>
            )}
          </h3>

          <div className="flex flex-wrap gap-2 mb-3">
            <span className={`text-xs font-semibold px-2.5 py-1 rounded-lg ${config.badgeBg} ${config.text}`}>{course.dept}</span>
            <span className={`text-xs font-semibold px-2.5 py-1 rounded-lg ${config.badgeBg} ${config.text}`}>{course.teacher || '未定'}</span>
            <span className={`text-xs font-bold px-2.5 py-1 rounded-lg bg-purple-100 text-purple-700`}>{course.type || '必修'}</span>
            <span className={`text-xs font-bold px-2.5 py-1 rounded-lg bg-indigo-100 text-indigo-700`}>{course.duration || '半學年'}</span>
            <span className={`text-xs font-semibold px-2.5 py-1 rounded-lg ${config.badgeBg} ${config.text}`}>{course.credits}學分</span>
          </div>
          <p className="text-slate-600 text-sm mb-4 flex-grow">{course.desc}</p>
        </div>
      );
    }

    // 管理表單元件
    function CourseFormModal({ course, onClose, onSave }) {
      const [formData, setFormData] = useState(course || {
        theme: '科技賦能', name: '', dept: '', semester: '114-1', type: '必修', duration: '半學年', teacher: '', credits: '2', tags: '', desc: '', syllabusUrl: '', images: []
      });
      const fileInputRef = useRef(null);

      const handleImagesUpload = (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 800;
              let scaleSize = img.width > MAX_WIDTH ? MAX_WIDTH / img.width : 1;
              canvas.width = img.width * scaleSize;
              canvas.height = img.height * scaleSize;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);
              
              setFormData(prev => ({
                ...prev,
                images: [...(prev.images || []), compressedBase64]
              }));
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        });
      };

      const removeImage = (indexToRemove) => {
        setFormData(prev => ({
          ...prev,
          images: prev.images.filter((_, idx) => idx !== indexToRemove)
        }));
      };

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 overflow-y-auto">
          <div className="bg-white rounded-3xl p-8 max-w-2xl w-full shadow-2xl my-8">
            <h2 className="text-2xl font-bold mb-6">{course ? '編輯課程' : '新增課程'}</h2>
            <form onSubmit={(e) => { e.preventDefault(); onSave(formData); }} className="space-y-4">
              <div>
                <label className="block text-sm font-bold mb-1">課程名稱</label>
                <input required type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full p-3 border rounded-xl" />
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-bold mb-1">主軸</label>
                  <select value={formData.theme} onChange={e => setFormData({...formData, theme: e.target.value})} className="w-full p-3 border rounded-xl">
                    {THEMES.filter(t => t !== '全部主軸').map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-sm font-bold mb-1">開課單位</label>
                  <input required type="text" value={formData.dept} onChange={e => setFormData({...formData, dept: e.target.value})} className="w-full p-3 border rounded-xl" />
                </div>
              </div>

              <div className="grid grid-cols-4 gap-3">
                <div>
                  <label className="block text-sm font-bold mb-1">性質</label>
                  <select value={formData.type || '必修'} onChange={e => setFormData({...formData, type: e.target.value})} className="w-full p-3 border rounded-xl">
                    {COURSE_TYPES.filter(t => t !== '全部').map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-sm font-bold mb-1">修別</label>
                  <select value={formData.duration || '半學年'} onChange={e => setFormData({...formData, duration: e.target.value})} className="w-full p-3 border rounded-xl">
                    {DURATION_TYPES.map(d => <option key={d} value={d}>{d}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-sm font-bold mb-1">學期</label>
                  <input type="text" value={formData.semester} onChange={e => setFormData({...formData, semester: e.target.value})} className="w-full p-3 border rounded-xl" placeholder="114-1" />
                </div>
                <div>
                  <label className="block text-sm font-bold mb-1">學分</label>
                  <input type="number" value={formData.credits} onChange={e => setFormData({...formData, credits: e.target.value})} className="w-full p-3 border rounded-xl" />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-bold mb-1">授課教師</label>
                  <input type="text" value={formData.teacher} onChange={e => setFormData({...formData, teacher: e.target.value})} className="w-full p-3 border rounded-xl" />
                </div>
                <div>
                  <label className="block text-sm font-bold mb-1">課綱網址</label>
                  <input type="url" value={formData.syllabusUrl || ''} onChange={e => setFormData({...formData, syllabusUrl: e.target.value})} placeholder="https://..." className="w-full p-3 border rounded-xl text-blue-600" />
                </div>
              </div>

              <div>
                <label className="block text-sm font-bold mb-1">成果照片上傳 (可選多張)</label>
                <div className="flex flex-wrap items-center gap-3 mb-2">
                  {formData.images && formData.images.map((imgSrc, idx) => (
                    <div key={idx} className="relative w-24 h-20 rounded-xl overflow-hidden border shadow-sm group">
                      <img src={imgSrc} className="w-full h-full object-cover" />
                      <button type="button" onClick={() => removeImage(idx)} className="absolute inset-0 bg-red-500/60 text-white text-xs font-bold flex items-center justify-center opacity-0 group-hover:opacity-100 transition">刪除</button>
                    </div>
                  ))}
                  <button type="button" onClick={() => fileInputRef.current.click()} className="px-5 py-6 bg-slate-50 border-2 border-dashed border-slate-300 hover:border-purple-400 rounded-xl text-slate-500 text-sm font-bold flex flex-col items-center justify-center">
                    <span>+ 新增照片</span>
                  </button>
                </div>
                <input type="file" accept="image/*" multiple ref={fileInputRef} onChange={handleImagesUpload} className="hidden" />
              </div>
              <div><label className="block text-sm font-bold mb-1">課程簡介</label><textarea rows="3" value={formData.desc} onChange={e => setFormData({...formData, desc: e.target.value})} className="w-full p-3 border rounded-xl"></textarea></div>
              <div className="flex justify-end space-x-3 pt-4">
                <button type="button" onClick={onClose} className="px-6 py-3 border rounded-xl font-bold">取消</button>
                <button type="submit" className="px-8 py-3 bg-purple-600 text-white rounded-xl font-bold">儲存</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
