<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課程新視界 - 國立臺北大學特色課程查詢系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body { font-family: 'Noto+Sans+TC', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 text-slate-800 min-h-screen selection:bg-purple-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect } = React;

    const THEMES = ['全部主軸', '科技賦能', '社會共好', '自主探索', '跨域創新', '實作體驗', '永續職能'];
    const COURSE_TYPES = ['全部', '必修', '選修', '通識'];
    const DURATION_TYPES = ['半學年', '全學年'];

    // 參照您的範例圖風格，為六大主軸設計的精緻師生互動向量情境插圖 (SVG)
    const THEME_CONFIGS = {
      '科技賦能': { 
        badgeBg: 'bg-blue-50', 
        text: 'text-blue-700', 
        svgIllustration: (
          <svg viewBox="0 0 400 200" className="w-full h-full object-cover">
            <defs>
              <linearGradient id="bg-tech" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#3b82f6" />
                <stop offset="50%" stopColor="#6366f1" />
                <stop offset="100%" stopColor="#1e1b4b" />
              </linearGradient>
            </defs>
            <rect width="400" height="200" fill="url(#bg-tech)" />
            {/* 背景波浪與發光線條 */}
            <path d="M 0 150 Q 150 80 400 130 L 400 200 L 0 200 Z" fill="#ffffff" opacity="0.1" />
            <path d="M 50 120 Q 200 50 350 100" stroke="#93c5fd" strokeWidth="2" fill="none" opacity="0.4" />
            {/* 浮動科技方塊 */}
            <rect x="220" y="30" width="35" height="35" rx="8" fill="#ffffff" opacity="0.2" />
            <circle cx="237.5" cy="47.5" r="8" stroke="#ffffff" strokeWidth="2" fill="none" opacity="0.8" />
            <rect x="290" y="50" width="45" height="40" rx="8" fill="#ffffff" opacity="0.25" />
            <rect x="300" y="60" width="25" height="15" rx="2" fill="#93c5fd" opacity="0.6" />
            {/* 電腦螢幕 */}
            <rect x="150" y="70" width="130" height="90" rx="6" fill="#1e293b" stroke="#93c5fd" strokeWidth="2" />
            <rect x="160" y="80" width="110" height="70" rx="4" fill="#0f172a" />
            <circle cx="215" cy="110" r="15" stroke="#38bdf8" strokeWidth="2" fill="none" opacity="0.8" />
            <path d="M 205 125 Q 215 115 225 125" stroke="#38bdf8" strokeWidth="2" fill="none" />
            {/* 師生人物剪影互動 */}
            {/* 左側學生 */}
            <circle cx="100" cy="115" r="12" fill="#fbbf24" />
            <path d="M 85 160 Q 95 130 115 130 L 125 160 Z" fill="#3b82f6" />
            {/* 右側老師/同學指導 */}
            <circle cx="310" cy="95" r="14" fill="#f43f5e" />
            <path d="M 290 150 Q 310 110 330 150 Z" fill="#6366f1" />
            <path d="M 310 105 L 270 125" stroke="#f43f5e" strokeWidth="4" strokeLinecap="round" />
          </svg>
        ) 
      },
      '社會共好': { 
        badgeBg: 'bg-orange-50', 
        text: 'text-orange-700', 
        svgIllustration: (
          <svg viewBox="0 0 400 200" className="w-full h-full object-cover">
            <defs>
              <linearGradient id="bg-social" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#f97316" />
                <stop offset="50%" stopColor="#ea580c" />
                <stop offset="100%" stopColor="#9a3412" />
              </linearGradient>
            </defs>
            <rect width="400" height="200" fill="url(#bg-social)" />
            <path d="M 0 160 Q 200 100 400 150 L 400 200 L 0 200 Z" fill="#ffffff" opacity="0.15" />
            {/* 社群與愛心互動圖標 */}
            <circle cx="200" cy="60" r="25" fill="#ffffff" opacity="0.2" />
            <path d="M 190 60 L 210 60 M 200 50 L 200 70" stroke="#ffffff" strokeWidth="3" strokeLinecap="round" opacity="0.8" />
            {/* 多人群體互動剪影 */}
            <circle cx="120" cy="100" r="12" fill="#fde68a" />
            <path d="M 100 160 Q 120 120 140 160 Z" fill="#2563eb" />
            <circle cx="200" cy="85" r="14" fill="#fde68a" />
            <path d="M 180 160 Q 200 100 220 160 Z" fill="#16a34a" />
            <circle cx="280" cy="100" r="12" fill="#fde68a" />
            <path d="M 260 160 Q 280 120 300 160 Z" fill="#dc2626" />
          </svg>
        ) 
      },
      '自主探索': { 
        badgeBg: 'bg-fuchsia-50', 
        text: 'text-fuchsia-700', 
        svgIllustration: (
          <svg viewBox="0 0 400 200" className="w-full h-full object-cover">
            <defs>
              <linearGradient id="bg-explore" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#d946ef" />
                <stop offset="50%" stopColor="#9333ea" />
                <stop offset="100%" stopColor="#581c87" />
              </linearGradient>
            </defs>
            <rect width="400" height="200" fill="url(#bg-explore)" />
            <path d="M 0 140 Q 200 180 400 120 L 400 200 L 0 200 Z" fill="#ffffff" opacity="0.1" />
            {/* 指南針與地圖意象 */}
            <circle cx="200" cy="90" r="35" stroke="#f0abfc" strokeWidth="3" fill="#ffffff" fillOpacity="0.15" />
            <polygon points="200,65 210,95 200,90 190,95" fill="#f472b6" />
            <polygon points="200,115 210,85 200,90 190,85" fill="#ffffff" />
            {/* 探索者剪影 */}
            <circle cx="110" cy="110" r="13" fill="#fed7aa" />
            <path d="M 90 160 Q 110 130 130 160 Z" fill="#38bdf8" />
          </svg>
        ) 
      },
      '跨域創新': { 
        badgeBg: 'bg-pink-50', 
        text: 'text-pink-700', 
        svgIllustration: (
          <svg viewBox="0 0 400 200" className="w-full h-full object-cover">
            <defs>
              <linearGradient id="bg-innovate" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#ec4899" />
                <stop offset="50%" stopColor="#e11d48" />
                <stop offset="100%" stopColor="#881337" />
              </linearGradient>
            </defs>
            <rect width="400" height="200" fill="url(#bg-innovate)" />
            <path d="M 0 150 Q 180 90 400 140 L 400 200 L 0 200 Z" fill="#ffffff" opacity="0.12" />
            {/* 燈泡與發想圖標 */}
            <circle cx="200" cy="80" r="28" fill="#fef08a" opacity="0.9" />
            <path d="M 190 100 L 210 100 M 195 106 L 205 106" stroke="#ca8a04" strokeWidth="3" strokeLinecap="round" />
            {/* 團隊腦力激盪 */}
            <circle cx="130" cy="120" r="12" fill="#fed7aa" />
            <path d="M 110 160 Q 130 140 150 160 Z" fill="#4f46e5" />
            <circle cx="270" cy="120" r="12" fill="#fed7aa" />
            <path d="M 250 160 Q 270 140 290 160 Z" fill="#0d9488" />
          </svg>
        ) 
      },
      '實作體驗': { 
        badgeBg: 'bg-emerald-50', 
        text: 'text-emerald-700', 
        svgIllustration: (
          <svg viewBox="0 0 400 200" className="w-full h-full object-cover">
            <defs>
              <linearGradient id="bg-practice" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#059669" />
                <stop offset="50%" stopColor="#0d9488" />
                <stop offset="100%" stopColor="#042f2e" />
              </linearGradient>
            </defs>
            <rect width="400" height="200" fill="url(#bg-practice)" />
            <path d="M 0 140 Q 200 190 400 130 L 400 200 L 0 200 Z" fill="#ffffff" opacity="0.1" />
            {/* 齒輪與工具圖標 */}
            <circle cx="200" cy="85" r="25" stroke="#99f6e4" strokeWidth="4" strokeLinecap="round" strokeDasharray="10 5" fill="none" />
            <circle cx="200" cy="85" r="10" fill="#ccfbf1" />
            {/* 動手實作剪影 */}
            <circle cx="150" cy="115" r="12" fill="#fde68a" />
            <path d="M 135 160 Q 150 130 165 160 Z" fill="#2563eb" />
          </svg>
        ) 
      },
      '永續職能': { 
        badgeBg: 'bg-cyan-50', 
        text: 'text-cyan-700', 
        svgIllustration: (
          <svg viewBox="0 0 400 200" className="w-full h-full object-cover">
            <defs>
              <linearGradient id="bg-sustain" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#06b6d4" />
                <stop offset="50%" stopColor="#0284c7" />
                <stop offset="100%" stopColor="#082f49" />
              </linearGradient>
            </defs>
            <rect width="400" height="200" fill="url(#bg-sustain)" />
            <path d="M 0 150 Q 200 100 400 160 L 400 200 L 0 200 Z" fill="#ffffff" opacity="0.12" />
            {/* 地球與綠能葉片 */}
            <circle cx="200" cy="85" r="30" stroke="#a5f3fc" strokeWidth="3" fill="none" opacity="0.8" />
            <path d="M 185 85 Q 200 65 215 85 Q 200 105 185 85 Z" fill="#6ee7b7" />
            {/* 團隊永續共學 */}
            <circle cx="140" cy="110" r="12" fill="#fed7aa" />
            <path d="M 125 160 Q 140 130 155 160 Z" fill="#16a34a" />
          </svg>
        ) 
      }
    };

    const INITIAL_COURSES = [
      {
        id: '1',
        theme: '科技賦能',
        name: '人工智慧與跨域應用實作',
        dept: '資訊工程學系',
        teacher: '張教授',
        semester: '114-1',
        type: '選修',
        duration: '半學年',
        credits: '3',
        tags: 'AI、Python、跨域共授',
        desc: '結合AI核心邏輯與各學門領域應用，帶領學生從零開始動手打造智慧專題。',
        syllabusUrl: 'https://ntpu.edu.tw',
        images: []
      }
    ];

    function App() {
      const [courses, setCourses] = useState([]);
      const [siteMeta, setSiteMeta] = useState({ updatedAt: '', source: '國立臺北大學教務處' });
      const [loading, setLoading] = useState(true);
      const [loadError, setLoadError] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [filterTheme, setFilterTheme] = useState('全部主軸');
      const [filterDept, setFilterDept] = useState('');
      const [filterType, setFilterType] = useState('全部');
      const [filterSemester, setFilterSemester] = useState('全部學期');
      const [mobileFiltersOpen, setMobileFiltersOpen] = useState(false);

      useEffect(() => {
        // 過渡期：同一網域可直接讀取舊版 localStorage，讓既有課程先完整出現在預覽頁。
        const saved = localStorage.getItem('ntpu_courses_local_v5');
        if (saved) {
          try {
            const legacyCourses = JSON.parse(saved);
            if (Array.isArray(legacyCourses) && legacyCourses.length) {
              setCourses(legacyCourses);
              setSiteMeta({ updatedAt: '2026-10-03', source: '舊版已匯出課程資料（遷移預覽）' });
              setLoading(false);
              return;
            }
          } catch (e) {}
        }
        fetch('./courses.json', { cache: 'no-store' })
          .then(res => { if (!res.ok) throw new Error('課程資料載入失敗'); return res.json(); })
          .then(data => {
            setCourses(Array.isArray(data) ? data : (data.courses || []));
            if (!Array.isArray(data)) setSiteMeta({ updatedAt: data.updatedAt || '', source: data.source || '國立臺北大學教務處' });
          })
          .catch(() => setLoadError('目前無法載入課程資料，請稍後再試。'))
          .finally(() => setLoading(false));
      }, []);

      const filteredCourses = useMemo(() => courses.filter(course => {
        const matchTheme = filterTheme === '全部主軸' || course.theme === filterTheme;
        const matchDept = filterDept === '' || course.dept === filterDept;
        const matchType = filterType === '全部' || course.type === filterType;
        const matchSemester = filterSemester === '全部學期' || course.semester === filterSemester;
        const tags = Array.isArray(course.tags) ? course.tags.join(' ') : (course.tags || '');
        const target = [course.name, course.teacher, course.tags, tags, course.desc, course.dept, course.semester, course.theme].filter(Boolean).join(' ').toLowerCase();
        return matchTheme && matchDept && matchType && matchSemester && (!searchQuery || target.includes(searchQuery.toLowerCase()));
      }), [courses, filterTheme, filterDept, filterType, filterSemester, searchQuery]);

      const departments = useMemo(() => ['全部單位', ...Array.from(new Set(courses.map(c => c.dept).filter(Boolean))).sort()], [courses]);
      const semesters = useMemo(() => ['全部學期', ...Array.from(new Set(courses.map(c => c.semester).filter(Boolean))).sort().reverse()], [courses]);

      const clearFilters = () => {
        setSearchQuery(''); setFilterTheme('全部主軸'); setFilterDept(''); setFilterType('全部'); setFilterSemester('全部學期');
      };

      const FilterPanel = () => (
        <div className="bg-white/80 backdrop-blur-xl p-5 sm:p-6 rounded-3xl shadow-sm border border-white">
          <div className="flex items-center justify-between mb-5 pb-3 border-b border-slate-200/50">
            <h2 className="text-lg font-bold text-slate-800">探索課程</h2>
            <button onClick={clearFilters} className="text-xs font-bold text-purple-600 hover:text-purple-800">清除篩選</button>
          </div>
          <input type="search" aria-label="搜尋課程" placeholder="搜尋課名、教師、單位、標籤..." value={searchQuery}
            onChange={e => setSearchQuery(e.target.value)}
            className="w-full px-4 py-3 mb-5 bg-white border-0 rounded-2xl ring-1 ring-slate-200 focus:ring-2 focus:ring-purple-400 outline-none text-sm shadow-sm" />
          <div className="grid grid-cols-1 sm:grid-cols-3 md:grid-cols-1 gap-3 mb-5">
            <label className="text-xs font-semibold text-slate-500">學期
              <select value={filterSemester} onChange={e=>setFilterSemester(e.target.value)} className="mt-1.5 w-full p-2.5 bg-white rounded-xl ring-1 ring-slate-200 text-sm">
                {semesters.map(v=><option key={v}>{v}</option>)}
              </select>
            </label>
            <label className="text-xs font-semibold text-slate-500">開課單位
              <select value={filterDept || '全部單位'} onChange={e=>setFilterDept(e.target.value==='全部單位'?'':e.target.value)} className="mt-1.5 w-full p-2.5 bg-white rounded-xl ring-1 ring-slate-200 text-sm">
                {departments.map(v=><option key={v}>{v}</option>)}
              </select>
            </label>
            <label className="text-xs font-semibold text-slate-500">必選修
              <select value={filterType} onChange={e=>setFilterType(e.target.value)} className="mt-1.5 w-full p-2.5 bg-white rounded-xl ring-1 ring-slate-200 text-sm">
                {COURSE_TYPES.map(v=><option key={v}>{v}</option>)}
              </select>
            </label>
          </div>
          <div>
            <div className="text-xs font-semibold text-slate-500 mb-2">六大主軸</div>
            <div className="flex flex-wrap md:flex-col gap-2">
              {THEMES.map(theme => <button key={theme} onClick={()=>setFilterTheme(theme)}
                className={`px-4 py-2.5 rounded-xl text-sm transition ${filterTheme===theme?'bg-purple-600 text-white shadow':'bg-white/70 text-slate-600 hover:bg-white'}`}>
                {theme}
              </button>)}
            </div>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen flex flex-col">
          <header className="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-white/50 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 min-h-16 py-3 flex items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
                <div className="bg-gradient-to-tr from-purple-500 to-pink-500 p-2 rounded-xl text-white">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                </div>
                <div><h1 className="text-xl sm:text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-purple-700 to-pink-600">課程新視界</h1>
                <p className="text-[11px] sm:text-xs text-slate-500">國立臺北大學特色課程查詢</p></div>
              </div>
              <button onClick={()=>setMobileFiltersOpen(v=>!v)} className="md:hidden px-4 py-2 bg-purple-600 text-white rounded-xl text-sm font-bold">篩選課程</button>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 flex-grow w-full">
            <section className="mb-7 bg-white/65 border border-white rounded-3xl p-6 sm:p-8 shadow-sm">
              <p className="text-sm font-bold text-purple-600 mb-2">特色課程探索平台</p>
              <h2 className="text-2xl sm:text-3xl font-black text-slate-900 mb-2">找到適合你的學習新可能</h2>
              <p className="text-sm sm:text-base text-slate-600">依學期、開課單位、課程性質與六大主軸快速探索特色課程。</p>
            </section>

            {mobileFiltersOpen && <div className="md:hidden mb-6"><FilterPanel /></div>}
            <div className="flex gap-8">
              <aside className="hidden md:block w-1/4 sticky top-24 h-max"><FilterPanel /></aside>
              <section className="w-full md:w-3/4">
                <div className="mb-5 px-1 flex items-end justify-between gap-3">
                  <div><h2 className="text-2xl font-black text-slate-800">{filterTheme}</h2><p className="text-sm text-slate-500 mt-1">共 {filteredCourses.length} 門課程</p></div>
                </div>
                {loading ? <div className="bg-white/70 rounded-3xl p-10 text-center text-slate-500">課程資料載入中…</div>
                : loadError ? <div className="bg-rose-50 rounded-3xl p-8 text-center text-rose-700">{loadError}</div>
                : filteredCourses.length === 0 ? <div className="bg-white/70 rounded-3xl p-10 text-center"><p className="font-bold text-slate-700">找不到符合條件的課程</p><button onClick={clearFilters} className="mt-3 text-purple-600 font-bold">清除篩選條件</button></div>
                : <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">{filteredCourses.map(course=><CourseCard key={course.id} course={course}/>)}</div>}
              </section>
            </div>
          </main>

          <footer className="mt-8 border-t border-white/70 bg-white/60">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-sm text-slate-500 flex flex-col sm:flex-row gap-2 sm:justify-between">
              <div>資料來源：{siteMeta.source}｜資料更新日期：{siteMeta.updatedAt || '未提供'}</div>
              <div>國立臺北大學教務處</div>
            </div>
          </footer>
        </div>
      );
    }

    // 課程卡片元件
    function CourseCard({ course }) {
      const [currentImgIdx, setCurrentImgIdx] = useState(0);
      const config = THEME_CONFIGS[course.theme] || { badgeBg: 'bg-purple-50', text: 'text-purple-700', svgIllustration: null };
      
      const hasImages = course.images && course.images.length > 0;

      useEffect(() => {
        if (!hasImages || course.images.length <= 1) return;
        const timer = setInterval(() => {
          setCurrentImgIdx(prev => (prev + 1) % course.images.length);
        }, 3500);
        return () => clearInterval(timer);
      }, [hasImages, course.images]);

      return (
        <div className="bg-white/80 backdrop-blur-lg rounded-[2rem] p-4 shadow-sm border border-white flex flex-col h-full hover:shadow-md transition">
          <div className="relative h-48 rounded-[1.5rem] overflow-hidden mb-4 shadow-inner bg-slate-900">
            {hasImages ? (
              <>
                <img src={course.images[currentImgIdx]} className="w-full h-full object-cover transition-all duration-700" />
                {course.images.length > 1 && (
                  <div className="absolute bottom-2 left-1/2 -translate-x-1/2 flex space-x-1.5 z-10">
                    {course.images.map((_, idx) => (
                      <span key={idx} className={`w-2 h-2 rounded-full transition-all ${idx === currentImgIdx ? 'bg-white w-4' : 'bg-white/50'}`}></span>
                    ))}
                  </div>
                )}
              </>
            ) : (
              <div className="w-full h-full">
                {config.svgIllustration}
              </div>
            )}
            
            <span className="absolute top-3 left-3 bg-white/90 text-slate-700 text-xs font-bold px-3 py-1 rounded-full shadow-sm z-10">{course.semester}</span>
            <span className={`absolute top-3 right-3 bg-white/90 ${config.text} text-xs font-black px-3 py-1 rounded-full shadow-sm z-10`}>{course.theme}</span>
          </div>

          <h3 className="text-xl font-black mb-3">
            {course.syllabusUrl ? (
              <a href={course.syllabusUrl} target="_blank" rel="noreferrer" className="hover:text-purple-600 underline decoration-purple-300 underline-offset-4 transition flex items-center w-fit">
                {course.name}
                <svg className="w-4 h-4 ml-1.5 opacity-70 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
              </a>
            ) : (
              <span>{course.name}</span>
            )}
          </h3>

          <div className="flex flex-wrap gap-2 mb-3">
            <span className={`text-xs font-semibold px-2.5 py-1 rounded-lg ${config.badgeBg} ${config.text}`}>{course.dept}</span>
            <span className={`text-xs font-semibold px-2.5 py-1 rounded-lg ${config.badgeBg} ${config.text}`}>{course.teacher || '未定'}</span>
            <span className={`text-xs font-bold px-2.5 py-1 rounded-lg bg-purple-100 text-purple-700`}>{course.type || '必修'}</span>
            <span className={`text-xs font-bold px-2.5 py-1 rounded-lg bg-indigo-100 text-indigo-700`}>{course.duration || '半學年'}</span>
            <span className={`text-xs font-semibold px-2.5 py-1 rounded-lg ${config.badgeBg} ${config.text}`}>{course.credits}學分</span>
          </div>
          <p className="text-slate-600 text-sm mb-4 flex-grow leading-relaxed">{course.desc}</p>
          {course.syllabusUrl && (
            <a href={course.syllabusUrl} target="_blank" rel="noreferrer" className="mt-auto inline-flex items-center justify-center px-4 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white text-sm font-bold transition">
              查看課程資訊／課綱 <span className="ml-1">↗</span>
            </a>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
